# =============================================================================
# Crudeoil Intraday Futures — MONITORING script settings
# =============================================================================
# This config is used by:
#   strategies/directional/commodity/crudeoil_intraday_future_long_directional/
#     monitoring_crudeoil_intraday_future_long_directional.py
#
# Assumed: a position has already been entered (by the execution script).
# This script recovers the open futures leg from DB, subscribes to WebSocket
# ticks, builds 1-min candles, and evaluates exit conditions on each close.
# =============================================================================

# ---------------------------------------------------------------------------
# OpenAlgo connection  →  set once in config/global_settings.yaml
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Strategy identity — MUST match execution script's STRATEGY_ID_PREFIX
# ---------------------------------------------------------------------------
STRATEGY_NAME: "COIL_INTRADAY_FUT"
STRATEGY_ID_PREFIX: "COIL"

# ---------------------------------------------------------------------------
# Execution mode for exits
# ---------------------------------------------------------------------------
EXECUTION_MODE: "MONITOR_ONLY"              # MONITOR_ONLY | EXIT_EXEC_MONITOR | FULL_EXEC

# ---------------------------------------------------------------------------
# Instrument
# ---------------------------------------------------------------------------
UNDERLYING: "CRUDEOIL"
EXCHANGE: "MCX"
EXCHANGE_INDEX: "MCX"                       # required by Config validator; not used for futures
EXCHANGE_OPTIONS: "MCX"                     # required by Config validator; not used for futures
INSTRUMENT_TYPE: "futures"
PRODUCT: "MIS"
LOT_SIZE: 100

# ---------------------------------------------------------------------------
# Indicators (must match execution script values — same engine, same params)
# ---------------------------------------------------------------------------
RSI_PERIOD: 14
RSI_EMA_FAST_PERIOD: 8
RSI_EMA_SLOW_PERIOD: 21
MACD_FAST: 8
MACD_SLOW: 21
MACD_SIGNAL: 5
SUPERTREND_PERIOD: 11
SUPERTREND_FACTOR: 2.0

# ---------------------------------------------------------------------------
# Warm-up
# ---------------------------------------------------------------------------
WARMUP_BARS: 100                            # historical 1-min bars to seed indicators

# ---------------------------------------------------------------------------
# Exit conditions — stop-loss parameters
# ---------------------------------------------------------------------------

# Initial hard SL: exit if M1-Close drops more than this many points from entry
# Example: entry=6000, INITIAL_SL_POINTS=30  → SL triggered if close < 5970
INITIAL_SL_POINTS: 30

# Swing low: exit if M1-Close < minimum low of the last N 1-min candles
SWING_LOW_CANDLES: 4

# RSI cross-below EMA21: confirmed over 2 consecutive 1-min candle closes
# (no config needed — hardcoded in ConfirmationCounter(required=2) in _engine.py)

# ---------------------------------------------------------------------------
# Trailing stop-loss (PriceStepTrailSL — price-based stepped trailing)
#
# Phase 1 (before activation):
#   SL fixed at: entry_price - INITIAL_SL_POINTS  (e.g. entry=6000 → SL=5970)
#
# Phase 2 (first activation — when price rises by TRAIL_ACTIVATION_POINTS):
#   SL jumps to: activation_price - TRAIL_OFFSET   (e.g. 6030 - 20 = 6010)
#   high_water anchors at activation_price
#
# Phase 3 (ratchet — each subsequent TRAIL_STEP_POINTS rise):
#   high_water advances; SL advances by TRAIL_STEP_POINTS
#   SL is always: high_water - TRAIL_OFFSET
#
# Example (default params):
#   Entry  @6000 → SL = 5970  (Phase 1, -30)
#   Price  @6030 → SL = 6010  (Phase 2 activated, 6030-20)
#   Price  @6035 → SL = 6015  (Phase 3, +5 ratchet)
#   Price  @6040 → SL = 6020  (Phase 3, +5 ratchet)
# ---------------------------------------------------------------------------
TRAIL_ACTIVATION_POINTS: 30                 # price must rise this many points to activate trailing
TRAIL_OFFSET: 20                            # SL is always: high_water - TRAIL_OFFSET
TRAIL_STEP_POINTS: 5                        # ratchet step: SL advances by this per step rise

# ---------------------------------------------------------------------------
# Intraday square-off
# ---------------------------------------------------------------------------
TRADE_VALIDITY: "INTRADAY"                  # INTRADAY | POSITIONAL
INTRADAY_EXIT_TIME: "23:00"                 # Force exit at this IST time
MTM_SNAPSHOT_INTERVAL: 15                   # Save MTM to DB every N candles (default 15 = every 15 mins)
                                            # MCX MIS auto sq-off ~23:00-23:15; exit early to
                                            # avoid broker square-off at bad price

# ---------------------------------------------------------------------------
# Order execution
# ---------------------------------------------------------------------------
MAX_ORDER_RETRY: 3
ORDER_POLL_INTERVAL: 2.0
ORDER_FILL_TIMEOUT: 60.0

# ---------------------------------------------------------------------------
# Persistence — MUST point to same DB as execution script
# ---------------------------------------------------------------------------
DATABASE_URL: "sqlite:///logs/strategies.db"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
LOG_FILE: "logs/coil_monitoring.log"
LOG_LEVEL: "DEBUG"

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
# Telegram settings  →  set in config/global_settings.yaml
# Override here to use different settings for this strategy only.
